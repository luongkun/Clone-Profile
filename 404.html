<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Không tìm thấy trang</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=7.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #fff;
            font-family: "Plus Jakarta Sans", "Space Grotesk", system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }
        /* Hai vệt sáng hồng mờ — cùng chất với trang chính */
        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
        }
        body::before { width: 480px; height: 480px; background: #ff6b9d; top: -120px; left: -100px; }
        body::after { width: 420px; height: 420px; background: #7c3aed; bottom: -140px; right: -80px; }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 56px 48px;
            border-radius: 28px;
            border: 1px solid rgba(255, 107, 157, 0.18);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            max-width: 440px;
            margin: 24px;
        }
        .code {
            font-family: "JetBrains Mono", monospace;
            font-size: clamp(4.5rem, 16vw, 7rem);
            font-weight: 700;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #ff6b9d 0%, #b388ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 1.35rem; font-weight: 700; margin: 10px 0 8px; }
        p { color: rgba(255, 255, 255, 0.6); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
        a.home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff6b9d 0%, #b388ff 100%);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a.home:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 107, 157, 0.35); }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>Trang này không tồn tại</h1>
        <p>Đường dẫn bạn vừa vào không có thật — có thể link sai hoặc đã bị dời.</p>
        <a class="home" href="/"><i class="fa-solid fa-house"></i> Về trang chính</a>
    </main>
</body>
</html>
